name: Pipeline Scan Cron

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify open signal lifecycles
        run: |
          code=$(curl -sS -o /tmp/verify.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 90 -X POST \
            https://kr-signal.vercel.app/api/cron/verify \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/verify.json
          test "$code" = "200"

      - name: Scan for new setups
        run: |
          code=$(curl -sS -o /tmp/scan.json -w "%{http_code}" \
            --connect-timeout 10 --max-time 110 -X POST \
            https://kr-signal.vercel.app/api/cron/pipeline \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/scan.json
          test "$code" = "200"
