name: 5-Minute Pipeline Scan Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Signal Pipeline Scan
        run: |
          curl -f -s -X POST https://kr-signal.vercel.app/api/cron/pipeline \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
